name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-ci:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: tag
        run: |
          version=$(bash scripts/release-tag.sh "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Wait for Test on the tagged master commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-for-release-ci.sh

  build-binaries:
    needs: check-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build Linux client and bridge archives
        run: bash scripts/build-binaries.sh
      - uses: actions/upload-artifact@v7
        with:
          name: go-archives
          path: build/binaries/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  build-server-image:
    needs: check-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build server image
        run: |
          docker build --pull -f cmd/server/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            -t svarog-server:release .
          docker save svarog-server:release | gzip -1 > "$RUNNER_TEMP/server-image.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: server-image
          path: ${{ runner.temp }}/server-image.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  package-java:
    needs: [check-ci, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/download-artifact@v8
        with:
          name: go-archives
          path: build/binaries
      - name: Set Maven release version
        env:
          VERSION: ${{ needs.check-ci.outputs.version }}
        run: |
          ./java/mvnw --batch-mode --no-transfer-progress -f java/pom.xml \
            org.codehaus.mojo:versions-maven-plugin:2.25.2:set \
            "-DnewVersion=$VERSION" -DgenerateBackupPoms=false
      - name: Build, sign and smoke-test the Maven bundle
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          : "${MAVEN_GPG_KEY:?Missing GPG private key}" "${MAVEN_GPG_PASSPHRASE:?Missing GPG passphrase}"
          bash scripts/package-logback.sh build/binaries -Pcentral-release -pl :svarog-logback,:svarog-spring-boot-starter -am deploy
      - uses: actions/upload-artifact@v7
        with:
          name: logback-release
          path: |
            build/binaries/svarog-logback.jar
            build/binaries/checksums.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: maven-central
          path: java/target/central-publishing/central-bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  publish-github:
    needs: package-java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-binaries
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: go-archives
          path: build/binaries
      # Includes the final checksums.txt covering all four archives and the JAR.
      - uses: actions/download-artifact@v8
        with:
          name: logback-release
          path: build/binaries
      - name: Publish versioned binaries release
        working-directory: build/binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --strict --check checksums.txt
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            printf 'Release %s already published.\n' "$GITHUB_REF_NAME"
            exit 0
          fi
          latest_tag=$(bash "$GITHUB_WORKSPACE/scripts/release-tag.sh" --latest)
          latest=false
          if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then latest=true; fi
          gh release create "$GITHUB_REF_NAME" *.tar.gz svarog-logback.jar checksums.txt \
            --verify-tag --generate-notes --latest="$latest"

  publish-maven:
    needs: package-java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: maven-central
          path: build/java
      - name: Submit bundle for automatic Maven Central publishing
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
        run: bash scripts/publish-maven.sh build/java/central-bundle.zip

  publish-images:
    needs: [build-binaries, build-server-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: server-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: go-archives
          path: build/binaries
      - name: Prepare release images
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          server="$repository:$GITHUB_REF_NAME"
          client="$repository-client:$GITHUB_REF_NAME"
          docker load -i "$RUNNER_TEMP/server-image.tar.gz"
          docker tag svarog-server:release "$server"
          mkdir -p build/client-image
          tar -xzf build/binaries/svarog-client_linux_amd64.tar.gz -C build/client-image
          docker build -f cmd/client/Dockerfile --target release --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            -t "$client" build/client-image
          printf 'SERVER_IMAGE=%s\nCLIENT_IMAGE=%s\n' "$server" "$client" >> "$GITHUB_ENV"
      - name: Publish images
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$SERVER_IMAGE"
          docker push "$CLIENT_IMAGE"
          latest_tag=$(bash scripts/release-tag.sh --latest)
          if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
            for image in "$SERVER_IMAGE" "$CLIENT_IMAGE"; do
              docker tag "$image" "${image%:*}:latest"
              docker push "${image%:*}:latest"
            done
          fi
      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
