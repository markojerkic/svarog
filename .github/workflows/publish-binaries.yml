name: Publish binaries

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: publish-binaries
  queue: max

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set Maven release version from tag
        run: |
          version=$(bash scripts/release-tag.sh "$GITHUB_REF_NAME")
          ./java/mvnw --batch-mode --no-transfer-progress -f java/pom.xml \
            org.codehaus.mojo:versions-maven-plugin:2.25.2:set \
            "-DnewVersion=$version" -DgenerateBackupPoms=false

      - name: Generate templates
        run: go tool templ generate ./...

      - name: Build client and bridge archives
        run: bash scripts/build-binaries.sh

      - name: Build Logback JAR with bundled bridges
        run: bash scripts/package-logback.sh

      - name: Publish versioned binaries release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            printf 'Release %s already published.\n' "$GITHUB_REF_NAME"
            exit 0
          fi
          latest_tag=$(bash scripts/release-tag.sh --latest)
          latest=false
          if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
            latest=true
          fi
          assets=(
            build/binaries/svarog-client_linux_amd64.tar.gz
            build/binaries/svarog-client_linux_arm64.tar.gz
            build/binaries/svarog-bridge_linux_amd64.tar.gz
            build/binaries/svarog-bridge_linux_arm64.tar.gz
            build/binaries/svarog-logback.jar
            build/binaries/checksums.txt
          )
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --generate-notes --latest="$latest"
