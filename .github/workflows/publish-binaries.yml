name: Publish CLI binaries

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-binaries-latest
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate templates
        run: go tool templ generate ./...

      - name: Build CLI archives
        run: bash scripts/build-client-binaries.sh

      - name: Publish latest CLI release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/client-release-notes.md"
          printf 'Rolling CLI build from commit [%s](%s/%s/commit/%s).\n\nLinux amd64 and arm64 archives.\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "$notes"
          assets=(
            build/client/svarog-client_linux_amd64.tar.gz
            build/client/svarog-client_linux_arm64.tar.gz
            build/client/checksums.txt
          )
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true --silent
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --title "Latest CLI build" --notes-file "$notes" --latest
          else
            gh release create latest "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Latest CLI build" --notes-file "$notes" --latest
          fi
