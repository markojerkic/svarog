name: Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  go-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.27.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Go lint
        run: gofmt -l .

  go-test:
    runs-on: ubuntu-latest
    needs: go-lint
    strategy:
      matrix:
        go-version: ["1.27.3"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Go tests
        run: |
          go tool templ generate ./...
          go test ./tests/...

  java-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test Java modules
        run: ./java/mvnw --batch-mode --no-transfer-progress -f java/pom.xml verify

      - name: Build Spring Boot demo against the published appender
        run: ./java/mvnw --batch-mode --no-transfer-progress -f java/svarog-spring-boot-demo/pom.xml verify

  playwright-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Browsers
        run: bun x playwright install chromium

      - name: Run Playwright tests
        run: bun run test
