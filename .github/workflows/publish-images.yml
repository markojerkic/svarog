name: Publish Docker images

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images
  queue: max

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare image names
        id: images
        run: |
          set -euo pipefail
          bash scripts/release-tag.sh "$GITHUB_REF_NAME" > /dev/null
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf 'server-image=%s\nclient-image=%s\n' \
            "${REGISTRY}/${repository}:${GITHUB_REF_NAME}" \
            "${REGISTRY}/${repository}-client:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            --username "$REGISTRY_USERNAME" --password-stdin

      - name: Build server image
        env:
          IMAGE: ${{ steps.images.outputs.server-image }}
        run: |
          set -euo pipefail
          docker build --pull \
            --file cmd/server/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --tag "$IMAGE" .

      - name: Build client image
        env:
          IMAGE: ${{ steps.images.outputs.client-image }}
        run: |
          set -euo pipefail
          docker build --pull \
            --file cmd/client/Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME#v}" \
            --tag "$IMAGE" .

      - name: Publish images
        env:
          SERVER_IMAGE: ${{ steps.images.outputs.server-image }}
          CLIENT_IMAGE: ${{ steps.images.outputs.client-image }}
        run: |
          set -euo pipefail
          docker push "$SERVER_IMAGE"
          docker push "$CLIENT_IMAGE"
          latest_tag=$(bash scripts/release-tag.sh --latest)
          if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
            for image in "$SERVER_IMAGE" "$CLIENT_IMAGE"; do
              latest_image="${image%:*}:latest"
              docker tag "$image" "$latest_image"
              docker push "$latest_image"
            done
          fi

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout "$REGISTRY"
