services:
  svarog-postgres:
    image: postgres:18.6-alpine
    container_name: svarog-postgres
    environment:
      POSTGRES_DB: svarog
      POSTGRES_USER: svarog
      POSTGRES_PASSWORD: svarog
    ports:
      - "127.0.0.1:${SVAROG_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./internal/persistence/postgres/migrations/000001_initial.up.sql:/docker-entrypoint-initdb.d/000001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svarog -d svarog"]
      interval: 5s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2.15.1-alpine
    container_name: svarog-nats
    ports:
      - "127.0.0.1:4222:4222"
    command: ["--config", "/config/nats-server.conf"]
    volumes:
      - ./nats-server.conf:/config/nats-server.conf:ro
      - nats_data:/data/jetstream
    restart: unless-stopped
volumes:
  postgres_data:
  nats_data:
