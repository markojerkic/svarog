name: svarog-embedded

services:
  svarog:
    image: ghcr.io/markojerkic/svarog-embedded:${SVAROG_VERSION:-latest}
    restart: unless-stopped
    # 30s HTTP/ingest shutdown + 5s log drain, then the broker flushes JetStream.
    stop_grace_period: 60s
    ports:
      - "${SVAROG_HTTP_BIND:-127.0.0.1}:${SVAROG_HTTP_PORT:-1325}:1323"
      - "${SVAROG_NATS_BIND:-127.0.0.1}:${SVAROG_NATS_PORT:-4223}:4222"
    environment:
      POSTGRES_URL: postgres://svarog:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/svarog?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NATS_ACCOUNT_SEED: ${NATS_ACCOUNT_SEED:?Set NATS_ACCOUNT_SEED}
      NATS_PUBLIC_ADDR: ${SVAROG_EMBEDDED_NATS_PUBLIC_ADDR:-localhost:${SVAROG_NATS_PORT:-4223}}
      SVAROG_CONN_STRING: ${SVAROG_CONN_STRING:-}
      SVAROG_INSTANCE_ID: ${SVAROG_INSTANCE_ID:-}
      SVAROG_LOG_QUEUE_CAPACITY: ${SVAROG_LOG_QUEUE_CAPACITY:-1024}
      ARCHIVE_DIR: /var/lib/svarog/archives
      ARCHIVE_SCHEDULER_ENABLED: ${ARCHIVE_SCHEDULER_ENABLED:-true}
    volumes:
      - nats-data:/var/lib/svarog/nats
      - archives:/var/lib/svarog/archives
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1323/login"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: svarog
      POSTGRES_USER: svarog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svarog -d svarog"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nats-data:
  archives:
  postgres-data:
