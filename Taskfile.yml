# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  # task dev PORT=1400 wins. Otherwise the same port the server reads:
  # process env, then .env.local, then .env.
  ENV_PORT:
    sh: |
      if [ -n "${HTTP_SERVER_PORT:-}" ]; then printf '%s\n' "$HTTP_SERVER_PORT"; exit 0; fi
      for f in .env.local .env; do
        [ -f "$f" ] || continue
        val=$(awk -F= '/^HTTP_SERVER_PORT=/ { gsub(/[ \r]/, "", $2); print $2; exit }' "$f")
        if [ -n "$val" ]; then printf '%s\n' "$val"; exit 0; fi
      done
  PORT: '{{.PORT | default .ENV_PORT | default "1323"}}'
  PROXY_PORT: '{{.PROXY_PORT | default "7331"}}'

tasks:
  sqlc:
    desc: Generate PostgreSQL queries
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  test:watch:
    desc: Run tests in watch mode
    watch: true
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    method: timestamp
    cmds:
      - go test {{.CLI_ARGS | default "./tests/..."}}

  reset-db:
    desc: Resets the database and nats
    cmds:
      - docker compose  -f docker-compose.dev.yml down -v

  db:
    desc: Starts the database and nats
    cmds:
      - docker compose --env-file .env -f docker-compose.dev.yml up -d --wait

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - bun run tw

  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - echo "Dev server http://localhost:{{.PROXY_PORT}} (app :{{.PORT}})"
      - go tool templ generate --watch --proxy="http://localhost:{{.PORT}}" --proxyport={{.PROXY_PORT}} --cmd="go run ./cmd/server" --open-browser=false
    env:
      HTTP_SERVER_PORT: "{{.PORT}}"
      SHADCN_TEMPL_DEV: "true"

  ui:scripts:
    desc: Watch shadcn-templ component scripts and rebuild their bundle
    cmds:
      - go tool shadcn-templ bundle --watch

  reload-assets:
    desc: Reload the browser when CSS or app JS changes
    cmds:
      - bun scripts/dev-reload.ts
    env:
      PROXY_PORT: "{{.PROXY_PORT}}"

  dev:
    desc: Start development server with hot reload
    deps:
      - db
    cmds:
      - task --parallel templ tailwind ui:scripts reload-assets PORT={{.PORT}} PROXY_PORT={{.PROXY_PORT}}

  build:
    desc: Build minified assets and the server binary
    cmds:
      - bun run tw:build
      - go tool shadcn-templ bundle
      - go tool templ generate ./...
      - CGO_ENABLED=0 go build -ldflags '-w -s' -o {{.OUT | default "/tmp/svarog-server"}} ./cmd/server

  clean-tmp:
    desc: Clean Go temporary build files from /tmp
    cmds:
      - find /tmp -maxdepth 1 -name "go-build*" -exec rm -rf {} +
      - echo "Cleaned /tmp/go-build* directories"

  docker:client:
    desc: Build the client Docker image
    cmds:
      - docker build --progress=plain -t markojerkic/svarog-client:{{.SVAROG_VERSION | default "latest"}} -f cmd/client/Dockerfile .

  docker:server:
    desc: Build the server Docker image
    cmds:
      - docker build --progress=plain -t markojerkic/svarog:{{.SVAROG_VERSION | default "latest"}} -f cmd/server/Dockerfile .

  docker:log-demo:
    desc: Build the log demo ingest Docker image
    cmds:
      - docker build --progress=plain -t markojerkic/svarog-log-demo:{{.SVAROG_VERSION | default "latest"}} -f cmd/log-demo/Dockerfile .

  docker:dev:
    desc: Run the docker dev environment
    cmds:
      - docker compose --env-file .env.docker up -d --force-recreate svarog

  default:
    desc: Build the Docker images
    cmds:
      - task docker:client
      - task docker:server
    silent: true
