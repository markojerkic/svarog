# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  # task dev PORT=1400 wins. Otherwise the same port the server reads:
  # process env, then .env.local, then .env.
  ENV_PORT:
    sh: |
      if [ -n "${HTTP_SERVER_PORT:-}" ]; then printf '%s\n' "$HTTP_SERVER_PORT"; exit 0; fi
      for f in .env.local .env; do
        [ -f "$f" ] || continue
        val=$(awk -F= '/^HTTP_SERVER_PORT=/ { gsub(/[ \r]/, "", $2); print $2; exit }' "$f")
        if [ -n "$val" ]; then printf '%s\n' "$val"; exit 0; fi
      done
  PORT: '{{.PORT | default .ENV_PORT | default "1323"}}'
  PROXY_PORT: '{{.PROXY_PORT | default "7331"}}'

tasks:
  sqlc:
    desc: Generate PostgreSQL queries
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  test:watch:
    desc: Run tests in watch mode
    watch: true
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    method: timestamp
    cmds:
      - go test {{.CLI_ARGS | default "./tests/..."}}

  reset-db:
    desc: Resets the database and nats
    cmds:
      - docker compose  -f docker-compose.dev.yml down -v

  db:
    desc: Starts the database and nats
    cmds:
      - docker compose --env-file .env -f docker-compose.dev.yml up -d --wait

  tailwind:
    desc: Watch Tailwind CSS changes
    cmds:
      - bun run tw

  templ:
    desc: Run templ with integrated server and hot reload
    cmds:
      - echo "Dev server http://localhost:{{.PROXY_PORT}} (app :{{.PORT}})"
      - go tool templ generate --watch --proxy="http://localhost:{{.PORT}}" --proxyport={{.PROXY_PORT}} --cmd="go run ./cmd/server" --open-browser=false
    env:
      HTTP_SERVER_PORT: "{{.PORT}}"
      SHADCN_TEMPL_DEV: "true"

  ui:scripts:
    desc: Watch shadcn-templ component scripts and rebuild their bundle
    cmds:
      - go tool shadcn-templ bundle --watch

  reload-assets:
    desc: Reload the browser when CSS or app JS changes
    cmds:
      - bun scripts/dev-reload.ts
    env:
      PROXY_PORT: "{{.PROXY_PORT}}"

  dev:
    desc: Start development server with hot reload
    deps:
      - db
    cmds:
      - task --parallel templ tailwind ui:scripts reload-assets PORT={{.PORT}} PROXY_PORT={{.PROXY_PORT}}

  build:
    desc: Build assets and a server binary (CMD=server or CMD=server-embedded)
    cmds:
      - task: build:assets
      - task: build:binary

  build:assets:
    desc: Build minified assets and generate templates
    cmds:
      - bun run tw:build
      - go tool shadcn-templ bundle
      - go tool templ generate ./...

  build:binary:
    desc: Compile the selected server binary using generated assets
    vars:
      SERVER_CMD: '{{.CMD | default "server"}}'
    cmds:
      - CGO_ENABLED=0 go build -ldflags '-w -s' -o "{{.OUT | default (printf "/tmp/svarog-%s" .SERVER_CMD)}}" "./cmd/{{.SERVER_CMD}}"

  build:client:
    desc: Build Linux CLI archives for amd64 and arm64 with checksums
    cmds:
      - bash scripts/build-binaries.sh "{{.OUT | default "build/client"}}" client

  build:bridge:
    desc: Build Linux bridge archives for amd64 and arm64 with checksums
    cmds:
      - bash scripts/build-binaries.sh "{{.OUT | default "build/bridge"}}" svarog-bridge

  build:binaries:
    desc: Build Linux client and bridge archives with shared checksums
    cmds:
      - bash scripts/build-binaries.sh "{{.OUT | default "build/binaries"}}"

  build:java:
    desc: Build and smoke-test the Logback release JAR with bundled Linux bridges
    cmds:
      - bash scripts/build-binaries.sh "{{.OUT | default "build/java"}}" svarog-bridge
      - bash scripts/package-logback.sh "{{.OUT | default "build/java"}}"

  clean-tmp:
    desc: Clean Go temporary build files from /tmp
    cmds:
      - find /tmp -maxdepth 1 -name "go-build*" -exec rm -rf {} +
      - echo "Cleaned /tmp/go-build* directories"

  docker:client:
    desc: Build the client Docker image
    cmds:
      - docker build --progress=plain -t ghcr.io/markojerkic/svarog-client:{{.SVAROG_VERSION | default "local"}} -f cmd/client/Dockerfile .

  docker:server:
    desc: Build the server Docker image
    cmds:
      - docker build --progress=plain --target server -t ghcr.io/markojerkic/svarog:{{.SVAROG_VERSION | default "local"}} -f cmd/server/Dockerfile .

  docker:server-embedded:
    desc: Build the server Docker image with embedded NATS
    cmds:
      - docker build --progress=plain --target server-embedded -t ghcr.io/markojerkic/svarog-embedded:{{.SVAROG_VERSION | default "local"}} -f cmd/server/Dockerfile .

  docker:log-demo:
    desc: Build the log demo Docker images in parallel
    deps:
      - docker:log-demo-cli
      - docker:log-demo-native
      - docker:log-demo-spring-boot

  docker:log-demo-cli:
    desc: Build the CLI log demo Docker image
    cmds:
      - docker build --pull --platform linux/amd64 --progress=plain -t markojerkic/svarog-log-demo:{{.SVAROG_VERSION | default "latest"}} cmd/log-demo

  docker:log-demo-native:
    desc: Build the native log demo Docker image
    cmds:
      - docker build --progress=plain -t markojerkic/svarog-log-demo-native:{{.SVAROG_VERSION | default "latest"}} -f cmd/log-interceptor-demo/Dockerfile .

  docker:log-demo-spring-boot:
    desc: Build the Spring Boot log demo Docker image
    cmds:
      - docker build --progress=plain -t markojerkic/svarog-log-demo-spring-boot:{{.SVAROG_VERSION | default "latest"}} java/svarog-spring-boot-demo

  docker:dev:
    desc: Run the docker dev environment
    env:
      SVAROG_VERSION: '{{.SVAROG_VERSION | default "local"}}'
    cmds:
      - docker compose --env-file .env.docker up -d --force-recreate svarog

  default:
    desc: Build the Docker images
    cmds:
      - task: docker:client
      - task: docker:server
      - task: docker:server-embedded
    silent: true
